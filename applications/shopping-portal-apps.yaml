apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopping-adminserver
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ziazeshan141/shopping-portal-gitops.git
    targetRevision: main
    path: helm/adminserver

  destination:
    server: https://kubernetes.default.svc
    namespace: shopping

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopping-product
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ziazeshan141/shopping-portal-gitops.git
    targetRevision: main
    path: helm/product

  destination:
    server: https://kubernetes.default.svc
    namespace: shopping

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: product
      namespace: shopping
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

---
apiVersion: argoproj.io/v1alpha1
